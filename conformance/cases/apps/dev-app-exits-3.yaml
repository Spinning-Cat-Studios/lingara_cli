# 16.10.26ae AC12 — clean_exit_parks_the_url
id: apps.dev-app-exits-3
title: The app exiting 3 ends and parks the session, and exits app_exited naming the status; the CLI never restarts it
behaviours: [B5]
command: apps dev
argv: [apps, dev]
credentials: stored
project: { slug: dev-basic, app: { exit_after_ms: 4000, status: 3 } }
mock: platform_dev
tunnel: fake
expect:
  exit: app_exited
  stdout: { empty: true }
  stderr: { message: app_exited, vars: { name: luba, status: "3" } }
  calls:
    - route: app_dev.session_open
    - route: app_dev.session_end
