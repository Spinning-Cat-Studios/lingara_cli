id: op.apps-create
title: The registration form registers an app from a manifest file under its client, publishes the private draft, and reads it once
behaviours: [B1, B5]
command: apps create
argv: [apps, create, Flashcards, --client, 0b9c4f0e-0000-4000-8000-000000000001, --manifest, "{fixtures}/manifests/flashcards.json", --json]
credentials: stored
expect:
  exit: ok
  stdout:
    json: { id: 7d1e2f30-0000-4000-8000-000000000001, kind: app, name: Flashcards, parent_id: 0b9c4f0e-0000-4000-8000-000000000001, client_id: lgr_cid_conformance_app }
exchanges:
  order: sequence
  items:
    - route: app.create
      request:
        json:
          kind: app
          name: Flashcards
          parent_id: 0b9c4f0e-0000-4000-8000-000000000001
          body:
            manifest:
              manifest_version: 1
              default_locale: en
              name: { en: Flashcards }
              description: { en: Cards after a lesson }
              render_url: https://cards.example.com/render
              slots: [lesson.end]
              context: []
              scopes: []
              tutor_note: false
      response:
        status: 201
        json: { id: 7d1e2f30-0000-4000-8000-000000000001, kind: app, visibility: private, version: { semver: "1.0.0", state: draft } }
    - route: app.publish
      vars: { id: 7d1e2f30-0000-4000-8000-000000000001, semver: "1.0.0" }
      response: { status: 200, json: { version: { semver: "1.0.0", state: published } } }
    - route: app.get
      vars: { id: 7d1e2f30-0000-4000-8000-000000000001 }
      response:
        status: 200
        json: { id: 7d1e2f30-0000-4000-8000-000000000001, kind: app, name: Flashcards, parent_id: 0b9c4f0e-0000-4000-8000-000000000001, client_id: lgr_cid_conformance_app }
