id: op.oauth-client-secret-delete-non-tty-flags
title: With -y and a matching --confirm, the revoke is the only request and carries the canonical email
behaviours: [B3, B5]
command: oauth_client secret delete
confirm: non_tty_flags
argv: [client, secret, delete, 0b9c4f0e-0000-4000-8000-000000000001, 4d4d4d4d-0000-4000-8000-000000000001, -y, --confirm, " DEV@conformance.invalid"]
credentials: stored
expect:
  exit: ok
  stdout: { empty: true }
exchanges:
  order: sequence
  items:
    - route: oauth_client.secret_delete
      vars: { id: 0b9c4f0e-0000-4000-8000-000000000001, secret_id: 4d4d4d4d-0000-4000-8000-000000000001 }
      request:
        headers: { content-type: { prefix: application/json } }
        json: { confirm: dev@conformance.invalid }
      response: { status: 204 }
