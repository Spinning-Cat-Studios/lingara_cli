id: op.apps-delete-pinned
title: The prompt counts the objects pinning the app, and n at the question deletes nothing
behaviours: [B3]
command: apps delete
confirm: tty_declined
argv: [apps, delete, 7d1e2f30-0000-4000-8000-000000000001]
tty: true
credentials: stored
interact:
  - expect: { message: confirm_pinned_by, vars: { count: "2" } }
    send: "n\n"
expect:
  exit: not_confirmed
  stdout: { empty: true }
  stderr: { message: confirm_declined }
exchanges:
  order: sequence
  items:
    - route: app.get
      vars: { id: 7d1e2f30-0000-4000-8000-000000000001 }
      response: { status: 200, json: { id: 7d1e2f30-0000-4000-8000-000000000001, kind: app, name: Flashcards, parent_id: 0b9c4f0e-0000-4000-8000-000000000001, pinned_by: 2 } }
