# 16.10.26ae AC13 — one_session_per_dev_version
id: apps.dev-held
title: A live lease held by another terminal makes the open exit dev_session_held, naming when the lease ends, before the app or the tunnel starts
behaviours: [B2]
command: apps dev
argv: [apps, dev]
credentials: stored
project: dev-basic
mock: platform_dev
mock_seed: { held_until: "2026-10-20T15:00:00Z" }
tunnel: fake
expect:
  exit: dev_session_held
  stdout: { empty: true }
  stderr: { message: dev_session_held, vars: { name: luba, lease_expires_at: "2026-10-20T15:00:00Z" } }
  calls:
    - route: app_dev.session_open
      json: { take_over: false }
    - route: app_dev.patch
      count: { min: 0, max: 0 }
