id: op.oauth-client-secret-delete-non-tty-refused
title: In a pipe without both flags, a secret revoke is refused before any request
behaviours: [B3]
command: oauth_client secret delete
confirm: non_tty_refused
argv: [client, secret, delete, 0b9c4f0e-0000-4000-8000-000000000001, 4d4d4d4d-0000-4000-8000-000000000001]
credentials: stored
expect:
  exit: not_confirmed
  stdout: { empty: true }
  stderr: { message: confirm_non_tty_refused }
