id: op.embed-delete-tty-ok
title: In a terminal, the prompt says every live embed token stops and names the client that goes with it
behaviours: [B3]
command: embed delete
confirm: tty_ok
argv: [embed, delete, 5e3a0c11-0000-4000-8000-000000000001]
tty: true
credentials: stored
interact:
  - expect: { message: confirm_yes_no, vars: { kind: embed, name: Word game, id: 5e3a0c11-0000-4000-8000-000000000001 } }
  - expect: { message: consequence_embed, vars: { client: 0b9c4f0e-0000-4000-8000-000000000001 } }
    send: "y\n"
  - expect: { message: confirm_type_email }
    send: "dev@conformance.invalid\n"
expect:
  exit: ok
  stdout: { empty: true }
exchanges:
  order: sequence
  items:
    - route: embed.get
      vars: { id: 5e3a0c11-0000-4000-8000-000000000001 }
      response: { status: 200, json: { id: 5e3a0c11-0000-4000-8000-000000000001, kind: embed, name: Word game, parent_id: 0b9c4f0e-0000-4000-8000-000000000001 } }
    - route: embed.delete
      vars: { id: 5e3a0c11-0000-4000-8000-000000000001 }
      request: { json: { confirm: dev@conformance.invalid } }
      response: { status: 200, json: { deleted: 2, pinned_by: 0 } }
