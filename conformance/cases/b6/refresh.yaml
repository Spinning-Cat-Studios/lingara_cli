id: b6.refresh
title: A stored credential refreshes with its refresh token and the CLI's public client id, and the record is rewritten
behaviours: [B6, B2]
command: apps list
argv: [apps, list, --json]
credentials: stored
expect:
  exit: ok
  stdout: { json: [] }
  redacted: [lgr_rt_conformance_rotated]
  stored_credentials: present
exchanges:
  order: sequence
  items:
    - route: app.list
      response: { status: 401, headers: { www-authenticate: 'Bearer error="invalid_token"' } }
    - route: oauth.token
      request:
        headers: { authorization: { absent: true } }
        form: { grant_type: refresh_token, refresh_token: lgr_rt_conformance_stored, client_id: lingara-cli }
      response:
        status: 200
        json: { access_token: lgr_at_conformance_rotated, refresh_token: lgr_rt_conformance_rotated, expires_in: 3600, scope: "platform:read platform:write canvas:read canvas:write" }
    - route: app.list
      request: { headers: { authorization: { equals: "Bearer lgr_at_conformance_rotated" } } }
      response: { status: 200, json: { items: [], next_cursor: null } }
