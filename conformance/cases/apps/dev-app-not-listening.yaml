# 16.10.26ae AC12 — clean_exit_parks_the_url
id: apps.dev-app-not-listening
title: An app that never accepts a connection ends the session after 60 s with app_not_listening, and is stopped
behaviours: [B5]
command: apps dev
argv: [apps, dev]
credentials: stored
project: { slug: dev-basic, app: { listen: false } }
mock: platform_dev
tunnel: fake
exit_timeout_secs: 80
expect:
  exit: app_not_listening
  stdout: { empty: true }
  stderr: { message: app_not_listening, vars: { name: luba } }
  calls:
    - route: app_dev.session_open
    - route: app_dev.session_end
