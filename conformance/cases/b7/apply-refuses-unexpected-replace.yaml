id: b7.apply-refuses-unexpected-replace
title: A would_replace verdict, which the token door no longer sends, stops apply before any write, naming the node
behaviours: [B7]
command: canvas apply
argv: [canvas, apply, 9f8e7d6c-0000-4000-8000-000000000001]
credentials: stored
expect:
  exit: refused
  stdout: { empty: true }
  stderr: { contains: [node n3, would_replace, nothing was applied] }
exchanges:
  order: sequence
  items:
    - route: canvas.get
      vars: { id: 9f8e7d6c-0000-4000-8000-000000000001 }
      response:
        status: 200
        json:
          id: 9f8e7d6c-0000-4000-8000-000000000001
          active: null
          draft:
            draft_version: 1
            objects: { n1: { id: 1a1a1a1a-0000-4000-8000-000000000001 }, n3: { id: 1c1c1c1c-0000-4000-8000-000000000003 } }
            definition:
              schema: 2
              nodes:
                - { id: n1, kind: client, position: [0, 0], fields: { name: My server, scopes: ["events:read"] }, script: null, custom: false, script_name: null, params: {} }
                - { id: n3, kind: webhook, position: [0, 0], fields: { url: "https://hooks.example.com/new", events: [lesson_plan.ready] }, script: null, custom: false, script_name: null, params: {} }
              edges: [ { from: n1, to: n3 } ]
    - route: oauth_client.list
      response: { status: 200, json: { items: [ { id: 0b9c4f0e-0000-4000-8000-000000000001, runtime_id: 1a1a1a1a-0000-4000-8000-000000000001, parent_id: null } ], next_cursor: null } }
    - route: webhook_outbound.list
      response: { status: 200, json: { items: [ { id: 3c5d7e9f-0000-4000-8000-000000000003, runtime_id: 1c1c1c1c-0000-4000-8000-000000000003, parent_id: 0b9c4f0e-0000-4000-8000-000000000001 } ], next_cursor: null } }
    - route: app.list
      response: { status: 200, json: { items: [], next_cursor: null } }
    - route: canvas.dry_run
      response:
        status: 200
        json:
          ok: true
          verdicts:
            - { handle: n1, kind: client, op: update, verdict: would_update, changes: [] }
            - { handle: n3, kind: webhook, op: update, verdict: would_replace, replaces: 1c1c1c1c-0000-4000-8000-000000000003 }
