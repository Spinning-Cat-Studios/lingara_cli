[package]
name = "lingara-cli-conformance"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Drives a lingara binary through the conformance cases against a mock platform, and checks what it sent and printed"
default-run = "cli-conformance"

[[bin]]
name = "cli-conformance"
path = "src/main.rs"

# The scriptable stand-in the runner's own tests spawn (ADR 16.10.26ac D9).
[[bin]]
name = "fake-cli"
path = "src/bin/fake_cli/main.rs"

# The `apps` group's fakes (ADR 16.10.26ae D11), which a case's `tunnel` and
# `project` keys hand the kit; the runner finds them beside its own binary.
[[bin]]
name = "fake-cloudflared"
path = "../fixtures/fake-cloudflared/main.rs"

[[bin]]
name = "fake-app"
path = "../fixtures/fake-app/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
httparse = "1"
# term: openpty, for a case's terminal (D5 step 4).
nix = { version = "0.31", features = ["term"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: a case served as JSON keeps the key order of its YAML.
serde_json = { version = "1", features = ["preserve_order"] }
# The maintained fork of the archived serde_yaml, under the same name.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
# expect.child_env compares the fake app's hashes of what it was given.
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
