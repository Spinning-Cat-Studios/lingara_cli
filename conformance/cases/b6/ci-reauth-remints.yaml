id: b6.ci-reauth-remints
title: Under CI a 401 is answered by one fresh client_credentials mint and one replay, never a refresh token
behaviours: [B6, B2]
command: apps list
argv: [apps, list, --json]
credentials: ci
expect:
  exit: ok
  stdout: { json: [] }
  stored_credentials: absent
exchanges:
  order: sequence
  items:
    - route: oauth.token
      request: { form: { grant_type: client_credentials, scope: "platform:read platform:write canvas:read canvas:write" } }
      response: { status: 200, json: { access_token: lgr_at_conformance_ci_1, expires_in: 3600 } }
    - route: app.list
      request: { headers: { authorization: { equals: "Bearer lgr_at_conformance_ci_1" } } }
      response: { status: 401, headers: { www-authenticate: 'Bearer error="invalid_token"' } }
    - route: oauth.token
      request: { form: { grant_type: client_credentials, scope: "platform:read platform:write canvas:read canvas:write" } }
      response: { status: 200, json: { access_token: lgr_at_conformance_ci_2, expires_in: 3600 } }
    - route: app.list
      request: { headers: { authorization: { equals: "Bearer lgr_at_conformance_ci_2" } } }
      response: { status: 200, json: { items: [], next_cursor: null } }
