# 16.10.26ae AC22 — pins_are_local_and_the_config_is_selectable
id: apps.pin-config-env
title: LINGARA_PLATFORM_TOML selects another file ahead of the nearest platform.toml
behaviours: [B1]
command: apps list
argv: [apps, list, --pinned, --json]
project: config-select
env: { LINGARA_PLATFORM_TOML: env.toml }
expect:
  exit: ok
  stdout:
    json: [ { name: from-env, path: ".", port: 8787 } ]
