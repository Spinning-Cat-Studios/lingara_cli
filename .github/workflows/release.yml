name: Release

# One file, two behaviours (ADR 22.10.26s §3: the clients' release process,
# as the app SDK ported it). It ships to staging and to the public repository
# alike. Everything before the publish jobs runs in both, so staging's run is
# the dry run and public repeats it before it publishes. The publish jobs run
# only in lingara_cli, and only for a registry languages.toml names.
#
# No registry credential exists outside lingara_cli's `release` environment.
# npm, crates.io and RubyGems mint a short-lived token through OIDC; Maven
# Central, the PHP mirror and the Homebrew tap read the environment's secrets.
#
# The GitHub Release has one writer, github-release; the tap has one writer,
# publish-go's goreleaser run (16.10.26af D4, 22.10.26s §7).
#
# release-manifest is installed from the public lingara_api_clients
# repository at the tag make/release.mk pins, never copied here.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      registries: ${{ steps.matrix.outputs.registries }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make install-release-manifest RELEASE_MANIFEST_ROOT="$RUNNER_TEMP/rm"
      - name: languages.toml agrees with the tree, and the tag may be released
        run: |
          "$RUNNER_TEMP/rm/bin/release-manifest" check
          "$RUNNER_TEMP/rm/bin/release-manifest" check-tag "$TAG"
      - id: matrix
        run: '"$RUNNER_TEMP/rm/bin/release-manifest" matrix "$TAG" | tee -a "$GITHUB_OUTPUT"'
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/rm/bin/release-manifest

  # Each leg runs the kit's own targets, so a release build is the local
  # build, then conformance at the tagged commit, unpacked and packaged, so no
  # publish job starts unless every kit passes it.
  build:
    name: build-${{ matrix.id }}
    needs: [manifest]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    env:
      ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.id == 'go' && '0' || '1' }}
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP"/bin/* && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Every leg runs the conformance host, which is Rust.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: matrix.id == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pcntl, posix
          tools: composer
          ini-values: phar.readonly=0
      # Node, Go, goreleaser, the JDK and Ruby, at mise.toml's pins.
      - uses: jdx/mise-action@v2
      - if: matrix.id == 'typescript'
        run: npm --prefix typescript ci

      - name: Build, tests and --version (build-<id>, test-<id>, check-version-<id>)
        run: make release-build ID="$ID"
      - name: Conformance (conformance-<id>, conformance-packaged-<id>)
        run: make release-conformance ID="$ID"

      # The kit's own pack, then its names on the Release. A tool that changes
      # its naming fails here rather than uploading nothing. `uploaded` is one
      # or more space-separated names (clients ADR 22.10.26r W8).
      - if: matrix.built != ''
        name: Pack, then move built → uploaded
        run: |
          set -eu
          case "$ID" in
            rust) cargo package -p lingara-cli --locked ;;
            typescript) (cd typescript && npm pack) ;;
            go) goreleaser release --clean --skip=publish ;;
            # Its own lines: the leak check reads a `;;` after `make <target>`
            # as a second, empty target name.
            php)
              make phar-php
              ;;
            *) echo "✗ no pack step for $ID"; exit 1 ;;
          esac
          read -r built uploaded <<EOF
          $(release-manifest artefact "$ID" "$TAG")
          EOF
          mkdir -p "$RUNNER_TEMP/artefact"
          case "$ID" in
            go)
              for name in $uploaded; do
                test -f "$built$name" || { echo "✗ $built$name was not written"; exit 1; }
                mv "$built$name" "$RUNNER_TEMP/artefact/$name"
              done ;;
            *)
              test -f "$built" || { echo "✗ $built was not written"; exit 1; }
              mv "$built" "$RUNNER_TEMP/artefact/$uploaded" ;;
          esac
          ls -l "$RUNNER_TEMP/artefact"
      # The directory, never ${{ matrix.uploaded }}: upload-artifact splits
      # `path` on newlines, so a space-joined list would name one missing file.
      - if: matrix.built != ''
        uses: actions/upload-artifact@v4
        with:
          name: artefact-${{ matrix.id }}
          path: ${{ runner.temp }}/artefact/

  # What each registry will receive, checked with no credential: staging's
  # whole rehearsal, and public's last check before it publishes.
  dry-run:
    name: dry-run-${{ matrix.id }}
    needs: [manifest, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    env:
      ID: ${{ matrix.id }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.built != ''
        uses: actions/download-artifact@v4
        with:
          name: artefact-${{ matrix.id }}
          path: ${{ runner.temp }}/artefact
      - if: matrix.registry == 'packagist'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          ini-values: phar.readonly=0
      - if: matrix.registry != 'go'
        uses: jdx/mise-action@v2

      - if: matrix.registry == 'npm'
        run: npm publish --dry-run --tag next "$RUNNER_TEMP/artefact/${{ matrix.uploaded }}"

      - if: matrix.registry == 'crates.io'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.registry == 'crates.io'
        run: cargo publish --dry-run --locked -p "$PACKAGE"

      - if: matrix.registry == 'maven-central'
        run: make maven-staging-dry-run

      # make package-ruby is also the check that `gem build` accepts the
      # bumped VERSION constant (22.10.26s §2).
      - if: matrix.registry == 'rubygems'
        run: make package-ruby

      - if: matrix.registry == 'packagist'
        run: make package-php

      # Go has no registry to rehearse: the downloaded SHA256SUMS covers the
      # six archives, and each archive matches its line.
      - if: matrix.registry == 'go'
        name: SHA256SUMS covers the six archives
        working-directory: ${{ runner.temp }}/artefact
        run: |
          set -eu
          test "$(ls lingara_*_*_* | wc -l | tr -d ' ')" = 6 || { echo "✗ not six archives"; exit 1; }
          for archive in lingara_*_*_*; do
            grep -q "  $archive\$" SHA256SUMS || { echo "✗ SHA256SUMS does not list $archive"; exit 1; }
          done
          sha256sum -c SHA256SUMS

  github-release:
    name: GitHub Release
    needs: [manifest, dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MATRIX: ${{ needs.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # Each row's `uploaded` is one or more space-separated names (W8), so
      # the rows are split before they are compared.
      - name: The asset set verify.assets names
        run: |
          want=$(echo "$MATRIX" | jq -c '[.include[].uploaded | select(. != "") | split(" ")[]] + ["checksums.txt"] | sort')
          echo "WANT=$want" >> "$GITHUB_ENV"
      # A published release is immutable, so a re-run never repairs one: it
      # accepts a finished release and refuses anything else by name.
      - id: existing
        name: An existing release is finished, or the job stops
        run: |
          if ! gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/state.json" 2>/dev/null; then
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if jq -e --argjson want "$WANT" '.isDraft == false and ([.assets[].name] | sort) == $want' "$RUNNER_TEMP/state.json" >/dev/null; then
            echo "✓ $TAG is already published with its assets"
            echo "published=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "✗ a release for $TAG exists in another state: $(jq -c '{isDraft, assets: [.assets[].name]}' "$RUNNER_TEMP/state.json")"
          exit 1
      - if: steps.existing.outputs.published == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: artefact-*
          merge-multiple: true
          path: assets
      # The body is the tagged commit's message body: in public, the
      # production note promotion wrote; in staging, the publish commit's.
      # The cat-file line drops the object headers, then the subject paragraph.
      # notes-scan.sh refuses a body naming a private repository (16.10.26af AC22).
      - if: steps.existing.outputs.published == 'false'
        name: Draft, upload, verify, publish
        run: |
          set -euo pipefail
          git cat-file commit "$GITHUB_SHA" | sed '1,/^$/d' | sed '1,/^$/d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "✗ the release notes for $TAG are empty"; exit 1; }
          sh tools/release/notes-scan.sh "$RUNNER_TEMP/notes.md"
          (cd assets && sha256sum * > checksums.txt && cat checksums.txt)
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" assets/*
          gh release view "$TAG" --json isDraft,assets |
            jq -e --argjson want "$WANT" '.isDraft == true and ([.assets[] | select(.size > 0) | .name] | sort) == $want'
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi

  # ── Publish: lingara_cli only, one job per registry ─────────────────
  #
  # Every job asks probe.sh whether its version is out and publishes only
  # when it is not, so re-running a partial release finishes it. Every job
  # ends by proving its install line installs a `lingara` that prints
  # `lingara <semver> (<id>)`, published this run or not.

  publish-npm:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_cli' && contains(fromJSON(needs.manifest.outputs.registries), 'npm')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The current LTS, not the build floor: trusted publishing needs npm ≥ 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      # The major is pinned: a new npm major is a reviewed bump, not a side effect
      # of the release date (clients ADR 9.10.26l; release-manifest check refuses `>=`).
      - run: npm install -g 'npm@^11.5.1' && npm --version
      - id: probe
        run: echo "state=$(sh tools/release/probe.sh typescript "$TAG")" >> "$GITHUB_OUTPUT"
      # The Release's own asset: the bytes that passed conformance. `next`
      # while the major is 0.
      - if: steps.probe.outputs.state == 'absent'
        run: |
          gh release download "$TAG" -p 'lingara-cli-typescript-*.tgz' -p checksums.txt -D "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum -c --ignore-missing checksums.txt
          npm publish --provenance --access public --tag next "lingara-cli-typescript-$TAG.tgz"
      - run: sh tools/release/prove-install.sh typescript "$TAG" --deadline 15m

  publish-crates:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_cli' && contains(fromJSON(needs.manifest.outputs.registries), 'crates.io')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - id: probe
        run: echo "state=$(sh tools/release/probe.sh rust "$TAG")" >> "$GITHUB_OUTPUT"
      # Cargo cannot publish a .crate file, so Rust alone re-packs.
      - if: steps.probe.outputs.state == 'absent'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.probe.outputs.state == 'absent'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p lingara-cli
      - run: sh tools/release/prove-install.sh rust "$TAG" --deadline 30m

  publish-rubygems:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_cli' && contains(fromJSON(needs.manifest.outputs.registries), 'rubygems')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - id: probe
        run: echo "state=$(sh tools/release/probe.sh ruby "$TAG")" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.state == 'absent'
        run: cd ruby && gem build lingara-cli.gemspec
      - if: steps.probe.outputs.state == 'absent'
        uses: rubygems/configure-rubygems-credentials@main
      # RubyGems spells the pre-release `.pre.`: lingara-cli-0.1.0.pre.alpha.1.gem.
      - if: steps.probe.outputs.state == 'absent'
        run: gem push "ruby/lingara-cli-$(release-manifest gem-version "${TAG#v}").gem"
      - run: sh tools/release/prove-install.sh ruby "$TAG" --deadline 15m

  publish-maven:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_cli' && contains(fromJSON(needs.manifest.outputs.registries), 'maven-central')
    runs-on: ubuntu-latest
    environment: release
    # Above the sum of the proofs' deadlines: 60m for Java, then 60m for Kotlin.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - uses: jbangdev/setup-jbang@main
      # Signs and uploads only the projects whose probe is 404. Central
      # rejects a duplicate version, so a probe that races its propagation
      # fails loudly and never publishes twice.
      - name: Sign and upload to the Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          for id in $(release-manifest langs); do
            case "$id" in java|kotlin) ;; *) continue ;; esac
            if [ "$(sh tools/release/probe.sh "$id" "$TAG")" = absent ]; then
              ./gradlew ":$id:publishAndReleaseToMavenCentral"
            fi
          done
      - name: Prove the install lines
        run: |
          for id in $(release-manifest langs); do
            case "$id" in java|kotlin) ;; *) continue ;; esac
            sh tools/release/prove-install.sh "$id" "$TAG" --deadline 60m
          done

  # The archives are already on the Release (github-release). This job's one
  # write is the formula: it refuses unless a local rebuild of the tag yields
  # the Release's SHA256SUMS byte for byte (16.10.26af D4's reproducible
  # build), then reruns goreleaser with the tap token so its brews publisher
  # commits Formula/lingara.rb; release.disable keeps it off the Release. On
  # ubuntu-latest, the host that built the Release's archives.
  publish-go:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_cli' && contains(fromJSON(needs.manifest.outputs.registries), 'go')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - id: probe
        run: echo "state=$(sh tools/release/probe.sh go "$TAG")" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.state == 'absent'
        name: A local rebuild matches the Release's SHA256SUMS
        run: |
          set -eu
          gh release download "$TAG" -p SHA256SUMS -D "$RUNNER_TEMP/release"
          goreleaser release --clean --skip=publish
          cmp dist/SHA256SUMS "$RUNNER_TEMP/release/SHA256SUMS" ||
            { echo "✗ a rebuild of $TAG does not reproduce the Release's SHA256SUMS; refusing to write the formula"; exit 1; }
      - if: steps.probe.outputs.state == 'absent'
        name: Write the formula to the tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: goreleaser release --clean

  # Homebrew's proof runs where Homebrew is the default: macOS. Linux
  # Homebrew stays a hand check (22.10.26s AC11).
  prove-go:
    needs: [manifest, publish-go]
    if: github.repository == 'Spinning-Cat-Studios/lingara_cli' && contains(fromJSON(needs.manifest.outputs.registries), 'go')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make install-release-manifest RELEASE_MANIFEST_ROOT="$RUNNER_TEMP/rm" && echo "$RUNNER_TEMP/rm/bin" >> "$GITHUB_PATH"
      - run: sh tools/release/prove-install.sh go "$TAG" --deadline 15m

  publish-packagist:
    needs: [manifest, github-release]
    if: github.repository == 'Spinning-Cat-Studios/lingara_cli' && contains(fromJSON(needs.manifest.outputs.registries), 'packagist')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      MIRROR: git@github.com:Spinning-Cat-Studios/lingara-cli-php.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/release-manifest" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      # Packagist reads composer.json from a repository root only, so php/ is
      # split onto the mirror and tagged there; Packagist's webhook does the
      # rest. The push is a fast-forward, except that the mirror's one-commit
      # placeholder is replaced once, under a lease on its exact sha.
      - name: Split php/ onto the mirror and tag it
        run: |
          if git ls-remote --exit-code --tags "$MIRROR" "refs/tags/$TAG" >/dev/null; then
            echo "✓ the mirror already has $TAG"; exit 0
          fi
          split=$(git subtree split --prefix=php HEAD)
          git fetch "$MIRROR" main
          current=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$current" "$split"; then
            git push "$MIRROR" "$split:refs/heads/main"
          elif [ "$(git rev-list --count "$current")" = 1 ]; then
            git push --force-with-lease="main:$current" "$MIRROR" "$split:refs/heads/main"
          else
            echo "✗ the mirror's main ($current) is not an ancestor of the split ($split); refusing a non-fast-forward"
            exit 1
          fi
          git push "$MIRROR" "$split:refs/tags/$TAG"
      - run: sh tools/release/prove-install.sh php "$TAG" --deadline 15m
