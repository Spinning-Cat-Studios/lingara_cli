id: op.webhook-inbound-delete-non-tty-refused
title: In a pipe without both flags, an inbound webhook delete is refused before any request
behaviours: [B3]
command: webhook inbound delete
confirm: non_tty_refused
argv: [webhook, inbound, delete, 2a4b6c8d-0000-4000-8000-000000000001]
credentials: stored
expect:
  exit: not_confirmed
  stdout: { empty: true }
  stderr: { message: confirm_non_tty_refused }
