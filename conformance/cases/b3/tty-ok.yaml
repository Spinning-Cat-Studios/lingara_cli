id: b3.tty-ok
title: In a terminal, y and the matching email delete the client, with its cascade named and the canonical email in the body
behaviours: [B3, B5]
command: oauth_client delete
confirm: tty_ok
argv: [client, delete, 0b9c4f0e-0000-4000-8000-000000000001]
tty: true
credentials: stored
interact:
  - expect: { message: confirm_yes_no, vars: { kind: OAuth client, name: My server, id: 0b9c4f0e-0000-4000-8000-000000000001 } }
  - expect: { message: consequence_oauth_client, vars: { apps: "1", embeds: "0", webhooks: "0" } }
    send: "y\n"
  - expect: { message: confirm_type_email }
    send: "Dev@Conformance.invalid \n"
expect:
  exit: ok
  stdout: { empty: true }
  stored_credentials: present
exchanges:
  order: sequence
  items:
    - route: oauth_client.get
      vars: { id: 0b9c4f0e-0000-4000-8000-000000000001 }
      request: { headers: { authorization: { prefix: "Bearer " } } }
      response:
        status: 200
        json:
          id: 0b9c4f0e-0000-4000-8000-000000000001
          kind: oauth_client
          name: My server
          children: [ { id: 7d1e2f30-0000-4000-8000-000000000001, kind: app, name: Flashcards } ]
    - route: oauth_client.delete
      vars: { id: 0b9c4f0e-0000-4000-8000-000000000001 }
      request: { json: { confirm: dev@conformance.invalid } }
      response: { status: 204 }
