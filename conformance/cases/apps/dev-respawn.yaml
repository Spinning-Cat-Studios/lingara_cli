# 16.10.26ae AC11 — repoints_on_tunnel_restart_then_gives_up
id: apps.dev-respawn
title: When cloudflared dies, apps dev respawns it and points the dev version at each new hostname; after the sixth death it ends the session and exits tunnel_failed
behaviours: [B5]
command: apps dev
argv: [apps, dev]
credentials: stored
project: dev-basic
mock: platform_dev
tunnel: { fake: { die_after_ms: [1500, 1500, 1500, 1500, 1500, 1500] } }
exit_timeout_secs: 90
expect:
  exit: tunnel_failed
  stdout: { empty: true }
  stderr: { message: tunnel_failed, vars: { name: luba } }
  calls:
    - route: app_dev.session_open
    - route: app_dev.patch
      json: { render_url: "https://conformance-1.trycloudflare.com/", session_id: 5e55a0c0-0000-4000-8000-000000000001, draft_version: 1 }
    - route: app_dev.patch
      json: { render_url: "https://conformance-2.trycloudflare.com/", session_id: 5e55a0c0-0000-4000-8000-000000000001, draft_version: 2 }
    - route: app_dev.patch
      json: { render_url: "https://conformance-3.trycloudflare.com/", session_id: 5e55a0c0-0000-4000-8000-000000000001, draft_version: 3 }
    - route: app_dev.patch
      json: { render_url: "https://conformance-4.trycloudflare.com/", session_id: 5e55a0c0-0000-4000-8000-000000000001, draft_version: 4 }
    - route: app_dev.patch
      json: { render_url: "https://conformance-5.trycloudflare.com/", session_id: 5e55a0c0-0000-4000-8000-000000000001, draft_version: 5 }
    - route: app_dev.patch
      json: { render_url: "https://conformance-6.trycloudflare.com/", session_id: 5e55a0c0-0000-4000-8000-000000000001, draft_version: 6 }
    - route: app_dev.session_end
