# 16.10.26ae AC20 — renews_on_the_server_lease_and_stops_when_lost
id: apps.dev-renew-lost
title: With a 3 s lease the CLI renews about every second; a not_live renew exits dev_session_lost with no session DELETE, and the app and tunnel are stopped
behaviours: [B5]
command: apps dev
argv: [apps, dev]
credentials: stored
project: dev-basic
mock: platform_dev
mock_seed: { lease_secs: 3, renew: [ok, ok, not_live] }
tunnel: fake
expect:
  exit: dev_session_lost
  stdout: { empty: true }
  stderr: { message: dev_session_lost, vars: { name: luba } }
  calls:
    - route: app_dev.session_open
    - route: app_dev.patch
    - route: app_dev.session_renew
      count: { min: 3, max: 3 }
    - route: app_dev.session_end
      count: { min: 0, max: 0 }
