id: op.oauth-client-secret-delete-tty-ok
title: In a terminal, the prompt names the client and the secret and says what stops, then y and the email revoke it
behaviours: [B3]
command: oauth_client secret delete
confirm: tty_ok
argv: [client, secret, delete, 0b9c4f0e-0000-4000-8000-000000000001, 4d4d4d4d-0000-4000-8000-000000000001]
tty: true
credentials: stored
interact:
  - expect: { message: confirm_yes_no, vars: { kind: secret, name: My server, id: 4d4d4d4d-0000-4000-8000-000000000001 } }
  - expect: { message: consequence_secret }
    send: "y\n"
  - expect: { message: confirm_type_email }
    send: "dev@conformance.invalid\n"
expect:
  exit: ok
  stdout: { empty: true }
exchanges:
  order: sequence
  items:
    - route: oauth_client.get
      vars: { id: 0b9c4f0e-0000-4000-8000-000000000001 }
      response: { status: 200, json: { id: 0b9c4f0e-0000-4000-8000-000000000001, kind: oauth_client, name: My server, pinned_by: 3 } }
    - route: oauth_client.secret_delete
      vars: { id: 0b9c4f0e-0000-4000-8000-000000000001, secret_id: 4d4d4d4d-0000-4000-8000-000000000001 }
      request: { json: { confirm: dev@conformance.invalid } }
      response: { status: 204 }
