id: op.oauth-client-secret-create
title: secret create mints a new secret, shown once, while the old one stays live
behaviours: [B1]
command: oauth_client secret create
argv: [client, secret, create, 0b9c4f0e-0000-4000-8000-000000000001, --json]
credentials: stored
expect:
  exit: ok
  stdout:
    json: { secret_id: 4d4d4d4d-0000-4000-8000-000000000002, prefix: lgr_cs_rota, secret: lgr_cs_conformance_rotated }
exchanges:
  order: sequence
  items:
    - route: oauth_client.secret_create
      vars: { id: 0b9c4f0e-0000-4000-8000-000000000001 }
      response: { status: 201, json: { secret_id: 4d4d4d4d-0000-4000-8000-000000000002, prefix: lgr_cs_rota, secret: lgr_cs_conformance_rotated } }
