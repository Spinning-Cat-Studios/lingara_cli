# 16.10.26ae AC12 — clean_exit_parks_the_url
id: apps.dev-interrupted
title: SIGINT after apps_dev_ready parks the session first, then stops the tunnel and the app, and exits interrupted; neither fake outlives the CLI
behaviours: [B5]
command: apps dev
argv: [apps, dev]
credentials: stored
project: dev-basic
mock: platform_dev
tunnel: fake
signal: { after: { message: apps_dev_ready }, send: SIGINT }
expect:
  exit: interrupted
  stdout: { empty: true }
  calls:
    - route: app_dev.session_open
    - route: app_dev.patch
    - route: app_dev.session_end
