id: op.apps-delete-non-tty-flags
title: With -y and a matching --confirm, the app delete is the only request and carries the canonical email
behaviours: [B3]
command: apps delete
confirm: non_tty_flags
argv: [apps, delete, 7d1e2f30-0000-4000-8000-000000000001, -y, --confirm, dev@conformance.invalid, --json]
credentials: stored
expect:
  exit: ok
  stdout: { json: {} }
exchanges:
  order: sequence
  items:
    - route: app.delete
      vars: { id: 7d1e2f30-0000-4000-8000-000000000001 }
      request: { json: { confirm: dev@conformance.invalid } }
      response: { status: 200, json: { deleted: 2, pinned_by: 0 } }
