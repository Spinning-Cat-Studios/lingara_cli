id: b2.stale-token-refreshes
title: A 401 to a bearer request refreshes once and replays it, and the table prints once
behaviours: [B2, B1, B5]
command: apps list
argv: [apps, list]
credentials: stored
expect:
  exit: ok
  stdout:
    table:
      columns: [ID, NAME, CLIENT, SERVING, VISIBILITY]
      rows:
        - [7d1e2f30-0000-4000-8000-000000000001, Flashcards, 0b9c4f0e-0000-4000-8000-000000000001, "1.0.0", private]
        - [7d1e2f30-0000-4000-8000-000000000002, Tone drills, 0b9c4f0e-0000-4000-8000-000000000001, "-", public]
  stored_credentials: present
exchanges:
  order: sequence
  items:
    - route: app.list
      request:
        headers:
          authorization: { equals: "Bearer lgr_at_conformance_stored" }
          accept-language: { equals: en-US }
      response:
        status: 401
        headers: { www-authenticate: 'Bearer error="invalid_token"' }
    - route: oauth.token
      request: { headers: { authorization: { absent: true } } }
      response:
        status: 200
        json: { access_token: lgr_at_conformance_refreshed, refresh_token: lgr_rt_conformance_refreshed, token_type: Bearer, expires_in: 3600 }
    - route: app.list
      request: { headers: { authorization: { equals: "Bearer lgr_at_conformance_refreshed" } } }
      response:
        status: 200
        json:
          items:
            - { id: 7d1e2f30-0000-4000-8000-000000000001, kind: app, name: Flashcards, parent_id: 0b9c4f0e-0000-4000-8000-000000000001, serving_version: "1.0.0", visibility: private }
            - { id: 7d1e2f30-0000-4000-8000-000000000002, kind: app, name: Tone drills, parent_id: 0b9c4f0e-0000-4000-8000-000000000001, serving_version: null, visibility: public }
          next_cursor: null
