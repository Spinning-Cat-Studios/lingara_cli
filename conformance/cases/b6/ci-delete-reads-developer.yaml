id: b6.ci-delete-reads-developer
title: Under CI, -y --confirm is checked against developer.me, read once after the mint, before the only destructive request
behaviours: [B6, B3]
command: oauth_client delete
confirm: non_tty_flags
argv: [client, delete, 0b9c4f0e-0000-4000-8000-000000000001, -y, --confirm, dev@conformance.invalid]
credentials: ci
expect:
  exit: ok
  stdout: { empty: true }
  stored_credentials: absent
exchanges:
  order: sequence
  items:
    - route: oauth.token
      response: { status: 200, json: { access_token: lgr_at_conformance_ci, expires_in: 3600 } }
    - route: developer.me
      response: { status: 200, json: { developer_id: 0b9c4f0e-0000-4000-8000-0000000000de, email: Dev@Conformance.invalid } }
    - route: oauth_client.delete
      vars: { id: 0b9c4f0e-0000-4000-8000-000000000001 }
      request: { json: { confirm: dev@conformance.invalid } }
      response: { status: 200, json: { deleted: 3, pinned_by: 0 } }
