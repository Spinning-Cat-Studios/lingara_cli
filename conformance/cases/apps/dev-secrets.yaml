# 16.10.26ae AC10 — secrets_reach_the_child_and_never_the_disk
id: apps.dev-secrets
title: The app's environment holds the session's minted secret and client pair, the row's env and env_file, and none of the CLI's LINGARA_PLATFORM_* credentials; no file holds a minted secret afterwards
behaviours: [B5, B6]
command: apps dev
argv: [apps, dev]
credentials: ci
project: dev-client
mock: platform_dev
tunnel: fake
signal: { after: { message: apps_dev_ready }, send: SIGINT }
expect:
  exit: interrupted
  stdout: { empty: true }
  redacted: [lgr_cs_conformance_ci]
  child_env:
    present: [LINGARA_APP_SECRET, LINGARA_CLIENT_ID, LINGARA_CLIENT_SECRET, PORT, LINGARA_APP_PORT, LUBA_PLAN_ID, LUBA_DIVE_DB]
    absent_prefix: [LINGARA_PLATFORM_]
    equals_session: [LINGARA_APP_SECRET, LINGARA_CLIENT_SECRET]
  calls:
    - route: app_dev.session_open
      json: { take_over: false, credentials: [client] }
    - route: app_dev.session_end
exchanges:
  order: sequence
  items:
    - route: oauth.token
      request:
        form: { grant_type: client_credentials, scope: "platform:read platform:write canvas:read canvas:write" }
      response: { status: 200, json: { access_token: lgr_at_conformance_ci, token_type: Bearer, expires_in: 3600, scope: "platform:read platform:write canvas:read canvas:write" } }
    - route: app.get
      vars: { id: 7d1e2f30-0000-4000-8000-000000000001 }
      response: { status: 200, json: { id: 7d1e2f30-0000-4000-8000-000000000001, kind: app, name: Luba, client_id: lgr_cid_conformance_app } }
