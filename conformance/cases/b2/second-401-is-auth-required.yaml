id: b2.second-401-is-auth-required
title: A 401 to the replay after one refresh exits auth_required, with exactly one token request
behaviours: [B2]
command: apps list
argv: [apps, list]
credentials: stored
expect:
  exit: auth_required
  stdout: { empty: true }
exchanges:
  order: sequence
  items:
    - route: app.list
      response:
        status: 401
        headers: { www-authenticate: 'Bearer error="invalid_token"' }
    - route: oauth.token
      response:
        status: 200
        json: { access_token: lgr_at_conformance_refreshed, refresh_token: lgr_rt_conformance_refreshed, token_type: Bearer, expires_in: 3600 }
    - route: app.list
      request: { headers: { authorization: { equals: "Bearer lgr_at_conformance_refreshed" } } }
      response:
        status: 401
        headers: { www-authenticate: 'Bearer error="invalid_token"' }
