[package]
name = "demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Lingara app."

# The library is named once here, so the code never spells the package name.
[lib]
name = "lingara_app"

[dependencies]
axum = "0.8"
lingara-apps = { version = "=0.1.0-alpha.8", features = ["axum"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
