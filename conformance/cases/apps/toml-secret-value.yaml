# 16.10.26ae AC6 — secret_values_are_refused_offline
id: apps.toml-secret-value
title: A real-looking lgr_ token in a value is refused offline, naming its key and never echoing it
behaviours: [B2]
command: apps list
argv: [apps, list, --pinned]
credentials: stored
project: toml-secret-value
expect:
  exit: platform_toml_secret
  stdout: { empty: true }
  stderr: { message: platform_toml_secret, vars: { key: apps.env.HOOK_KEY } }
  redacted: [lgr_whsec_conformanceLeakedValue]
